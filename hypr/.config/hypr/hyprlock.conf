# ~/.config/hypr/hyprlock.conf
# Minimal, stable configuration for hyprlock v0.9.1+

general {
    hide_cursor = true
    # grace = 0
    # no_fade_in = false
    # no_fade_out = false
}

background {
    path = ~/.config/hypr/hypaper/gentoo.png
    # blur_passes = 1 now these are deprecated in hyprlock
    # blur_size = 4
    # noise = 0.01
}

input-field {
    size = 250, 50
    position = 700, -50
    dots_size = 0.3
    dots_spacing = 0.2
    outer_color = rgb(1E1E2E)
    inner_color = rgb(1E1E2E)
    font_color  = rgb(CDD6F4)
    fade_on_empty = true
    placeholder_text = Password...

    # Show a one-line fail message (no quotes, no \n)
    fail_text   = Fuck off DUMBASS
    fail_color  = rgb(F38BA8)     # text color when wrong
    fail_inner  = rgba(3b1f2aff)  # bubble fill on fail
    fail_outer  = rgb(F38BA8)     # bubble border on fail
}

label {
    text = $TIME
    font_size = 64
    position = 700, -160
    color = rgb(CDD6F4)
    halign = center
    valign = center
}

label {
    text = welcome wolfer
    font_size = 18
    position = 700, -100
    color = rgb(CDD6F4)
    halign = center
}


