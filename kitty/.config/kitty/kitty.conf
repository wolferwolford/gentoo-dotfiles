#####---------kitty.conf----------

#-----------------------------
#old conf
#-----------------------------
# background #RRGGBBAA   
# background_image    ~/Downloads/Arch2.png
# background_image_layout scaled
# background_image_alignment center
#background_image_opacity 0.1

#colour scheme
#color0 #000000
#color8 #767676
# include ~/.local/share/nvim/lazy/tokyonight.nvim/extras/kitty/tokyonight_moon.conf



#-----------------------------
# UI
#-----------------------------
background_opacity  0.85
#dynamic_background_opacity yes  # Auto-adjusts opacity when typing
dynamic_background_opacity no
scrollback_lines 20000

# windows margin 
window_margin_width 3
window_border_width 2pt

confirm_os_window_close 0
allow_remote_control yes
listen_on unix:/tmp/kitty
#this is because Kitty keeps the window open because of its own window policy,
#though your shell session is clean (checked jobs , disown if any. if session
#still persist do - nohup waybar >/dev/null 2>&1 &
#or setsid waybar >/dev/null 2>&1 &    and then disown. can also use
#kitty @ launch --type=overlay --hold waybar  )
# cursor #cccccc
# cursor_shape_unfocused block


#-----------------------------
#Built-in
#-----------------------------
# ctrl+shift+f2 - to load a conf file automatically
# ctrl+shift+f5 - to reload the kitty with all new setting
# ctrl+shift+q  - to force kill a window

# window Management
# window in previous working dir
map ctrl+alt+enter launch --cwd=current --type=window 
#map ctrl+n launch --location=neighbor(creating problen while switching from terminal mode to normal mode)
# map ctrl+f launch --location=first (interfaring with neo-tree built in commands)
# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
# map f7 layout_action rotate (not working as intended, finding the route cause)
# Switch focus to the neighboring window in the indicated direction(don't enable it, messes with fast moving of the cursor)
# map ctrl+left neighboring_window left
# map ctrl+right neighboring_window right
# map ctrl+up neighboring_window up
# map ctrl+down neighboring_window down
# map ctrl+shift+enter new_window - opens a new window in current tab
## zsh/nvim #-for a new window with the current working directory set to the working directoryhough your shell session is clean
# map ctrl+shift+w close_window - for closing a window(i use ctrl+d bty)
# map ctrl+shift+] next_window  - move to new window (ctrl+shift+right & ctrl+right are also working, can't find it in document through)
# map ctrl+shift+[ previous_window  - move to previous_window (ctrl+shift+left & ctrl+left are also working, can't find it in documents though)
# map ctrl+shift+f move_window_forward  - move forward (changes window position on pane)
# map ctrl+shift+b move_window_backward - move backward(same as forward)
# map ctrl+shift+r start_resizing_window - start_resizing_window(works better than the manpping u did with alt+<arrow_key>)
# map ctrl+shift+n <number>_window  - to navigate to windows(eg. n=1, first)
# map ctrl+shift+f7 focus_visible_window  - visually select the window to go
# map ctrl+shift+f8 swap_with_window  - like ctrl+shift+f, uses this when more than two windows
# map ctrl+tab next_tab - tab Navigation forward
# map ctrl+shift+tabs - tab Navigation backward 
# map ctrl+shift+t new_tab  - opens a new tab (can also map ctrl+t launch --type=tab)
# map ctrl+shift+q close_tab  - closes that tab (i use ctrl+d bty)
# map ctrl+shift+. move_tab_forward - tab position next in tab_bar_style
# map ctrl+shift+, move_tab_backward  - tab position previous in tab_bar_style
# map ctrl+shift+alt+t set_tab_title  - set title of tab in tab_bar_style
# map ctrl+shift+l next_layout  - swithes to inbuilt layout system
# map ctrl+alt+t goto_layout tall - swithes to tall layout system
# map ctrl+alt+s goto_layout stack  - switches to stack layout system
# map ctrl+alt+p last_used_layout - switches to previous layout
# map ctrl+shift+f1 show_kitty_doc overview  - u basically go to url
# *Note - ctrl+alt+right/left is working for switching from left to right opened destop (works outside kitty)
# map ctrl+shift+n new_os_window  - a new terminal open not relating to current one
# map ctrl+shift+w close_window - closed that terminal



#-----------------------------
# scrolling
#-----------------------------
# Remove default binding
map ctrl+shift+h no_op
# Set pager to Ctrl+Shift+P
map ctrl+shift+p show_scrollback



#-----------------------------
# Tab
#-----------------------------
# Remove default bindings
# map ctrl+shift+right no_op
# map ctrl+shift+left no_op
# map ctrl+shift+j previous_tab
# map ctrl+shift+k next_tab

# UI
tab_bar_style powerline
tab_powerline_style round
# tab_powerline_style slanted
tab_activity_symbol *
map ctrl+shift+alt+t set_tab_title
tab_bar_align center
# tabs boarder colour
# active_border_color #ffa07a
# inactive_border_color #738276 



#-----------------------------
#Movement
#-----------------------------
# Move the active window in the indicated direction (same effect as
#ctrl+shift+F8 but more control)
map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down



#-----------------------------
# resizing of window
#-----------------------------
# reset all windows in the tab to default sizes
map ctrl+home no_op
map ctrl+0 resize_window reset
# use C-S-r for fine control



#-----------------------------
# layout
#-----------------------------
enabled_layouts *
map ctrl+alt+f goto_layout fat
map ctrl+alt+g goto_layout grid
map ctrl+alt+h goto_layout horizontal
map ctrl+alt+p goto_layout splits
map ctrl+alt+s goto_layout stack
map ctrl+alt+t goto_layout tall
map ctrl+alt+v goto_layout vertical
map ctrl+alt+u last_used_layout
# Toggles through layouts
map ctrl+shift+l no_op
map ctrl+alt+l next_layout #though your shell session is clean
# for horizontal and vertical split first go to desire layout then do split
# in kitty this is the layput rotation
# fat->grid->horozonatl->splits->stack->tall->vertical->fat



#-----------------------------
# Config added via kitty +kitten
#-----------------------------
# BEGIN_KITTY_FONTS
# font_family      family='CaskaydiaCove Nerd Font' postscript_name=CaskaydiaCoveNF-Regular
font_family JetBrainsMono Nerd Font
font_size 15
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS



# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME



#-----------------------------
# Split windows UI1
#-----------------------------
active_border_color #bd93f9
inactive_border_color #44475a
window_border_width 1pt
draw_minimal_borders yes
# dim_opacity 0.40
focus_follows_mouse yes
inactive_text_alpha 0.3